services:
  ipcamlapse:
    image: ghcr.io/kalyterasystems/ipcamlapse:latest
    build:
      context: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      LocalAccess__AllowPrivateNetworks: "true"
      Storage__DataPath: /data
    volumes:
      - ipcamlapse-data:/data
    restart: unless-stopped

volumes:
  ipcamlapse-data:
