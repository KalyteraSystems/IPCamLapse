name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kalyterasystems/ipcamlapse
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'ipcamlapse:smoke' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start PR image and wait for liveness
        if: github.event_name == 'pull_request'
        env:
          SMOKE_CONTAINER: ipcamlapse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run --detach --name "$SMOKE_CONTAINER" ipcamlapse:smoke
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$SMOKE_CONTAINER")
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Verify non-root process and writable data volume
        if: github.event_name == 'pull_request'
        env:
          SMOKE_CONTAINER: ipcamlapse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$(docker exec "$SMOKE_CONTAINER" id -u)" -ne 0
          docker exec "$SMOKE_CONTAINER" sh -c \
            'probe=/data/.runtime-smoke; : > "$probe"; test -f "$probe"; rm "$probe"; test ! -e "$probe"'

      - name: Print container diagnostics on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          SMOKE_CONTAINER: ipcamlapse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if docker inspect "$SMOKE_CONTAINER" >/dev/null 2>&1; then
            docker inspect "$SMOKE_CONTAINER"
            docker logs "$SMOKE_CONTAINER"
          fi

      - name: Remove smoke-test container
        if: always() && github.event_name == 'pull_request'
        env:
          SMOKE_CONTAINER: ipcamlapse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$SMOKE_CONTAINER" 2>/dev/null || true
